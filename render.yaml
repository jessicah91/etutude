services:
  - type: web
    name: etutude-prototype
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/admin/me
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
