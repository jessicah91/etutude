
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ETU-TUDE 관리자 로그인</title>

  <meta name="theme-color" content="#ff79ad" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <style>
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#ffd7ea;color:#3e2d36}
    .wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:
      linear-gradient(0deg, rgba(255,255,255,.16) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.16) 1px, transparent 1px),
      linear-gradient(180deg,#ffd7ea 0%,#ffc6e0 100%);background-size:18px 18px,18px 18px,100% 100%;}
    .card{width:min(420px,100%);background:#fff7fb;border:4px solid #4b3640;box-shadow:8px 8px 0 rgba(75,54,64,.18);padding:24px}
    h1{margin:0 0 10px;font-size:28px;line-height:1.2}
    p{margin:0 0 16px;line-height:1.6;color:#6a4c59}
    label{display:block;font-size:13px;font-weight:800;margin:14px 0 8px}
    input{width:100%;box-sizing:border-box;border:3px solid #4b3640;padding:14px 12px;font-size:15px;background:#fff}
    button{width:100%;margin-top:16px;border:4px solid #4b3640;background:#ff79ad;color:#fff;padding:14px;font-size:15px;font-weight:900;box-shadow:4px 4px 0 rgba(75,54,64,.18);cursor:pointer}
    .hint,.error{font-size:13px;line-height:1.6;margin-top:12px}
    .error{color:#b41257;display:none}
    .mini{font-size:12px;color:#7d6070;margin-top:18px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>OWNER LOGIN</h1>
      <p>테스트 결과 저장 로그를 보는 관리자 페이지예요.</p>
      <form id="loginForm">
        <label for="username">아이디</label>
        <input id="username" name="username" type="text" placeholder="admin" autocomplete="username" required />
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" placeholder="비밀번호 입력" autocomplete="current-password" required />
        <button type="submit">로그인</button>
        <div class="error" id="errorBox">로그인에 실패했어요. 아이디와 비밀번호를 다시 확인해 주세요.</div>
      </form>
      <div class="hint">배포할 때는 <strong>SUPABASE_URL</strong>, <strong>SUPABASE_SERVICE_ROLE_KEY</strong>, <strong>ADMIN_USERNAME</strong>, <strong>ADMIN_PASSWORD</strong>, <strong>ADMIN_SESSION_SECRET</strong> 환경변수를 꼭 설정해 주세요.</div>
      <div class="mini">공개 배포 전에는 꼭 비밀번호를 바꿔 주세요.</div>
    </div>
  </div>
  <script>
    async function checkLoggedIn(){
      const res = await fetch('/api/admin/me');
      const data = await res.json();
      if(data.authenticated){
        location.href='/admin';
      }
    }
    checkLoggedIn();

    document.getElementById('loginForm').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const errorBox = document.getElementById('errorBox');
      errorBox.style.display='none';
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const res = await fetch('/api/admin/login', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ username, password })
      });
      if(res.ok){
        location.href='/admin';
      }else{
        errorBox.style.display='block';
      }
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(()=>{});
    }
  </script>
</body>
</html>
