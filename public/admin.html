<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ETU-TUDE 관리자 대시보드</title>
  <style>
    :root{--ink:#3e2d36;--pink:#ff79ad;--pink2:#ffd9ea;--line:#4b3640;--bg:#fff5fa;}
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink);background:
      linear-gradient(0deg, rgba(255,255,255,.14) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.14) 1px, transparent 1px),
      linear-gradient(180deg,#ffd7ea 0%,#ffc6e0 100%);background-size:18px 18px,18px 18px,100% 100%;}
    .page{max-width:1200px;margin:0 auto;padding:24px}
    .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:18px}
    h1{margin:0;font-size:30px}
    .sub{margin-top:6px;color:#6a4c59;line-height:1.5}
    .btn{appearance:none;border:4px solid var(--line);background:#fff;padding:12px 14px;font-weight:900;box-shadow:4px 4px 0 rgba(75,54,64,.18);cursor:pointer}
    .btn.primary{background:var(--pink);color:#fff}
    .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
    .card,.stat{background:#fff8fc;border:4px solid var(--line);box-shadow:6px 6px 0 rgba(75,54,64,.14)}
    .stat{padding:18px}
    .label{font-size:12px;font-weight:900;color:#7e5a6d;margin-bottom:8px}
    .value{font-size:28px;font-weight:900}
    .value.compact{font-size:18px;line-height:1.45}
    .filters{padding:16px;display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:10px;align-items:end;margin-bottom:18px}
    .filters label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}
    .filters input,.filters select{width:100%;padding:12px;border:3px solid var(--line);background:#fff;font-size:14px}
    .table-card{padding:0;overflow:hidden}
    table{width:100%;border-collapse:collapse;background:#fff}
    th,td{padding:12px 10px;border-bottom:2px solid #f0c9da;text-align:left;vertical-align:top;font-size:14px}
    th{background:#fff0f7;font-size:12px;letter-spacing:.02em}
    .chip{display:inline-block;padding:6px 8px;border:2px solid var(--line);background:#fff0f7;font-size:12px;font-weight:800;margin:2px 4px 2px 0}
    .chip.kind-daily{background:#fff1f6}
    .chip.kind-weekly{background:#f4efff}
    .muted{color:#7a6370;font-size:12px;line-height:1.4}
    .empty{padding:30px;text-align:center;color:#7a6370}
    .row-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    @media (max-width:900px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.filters{grid-template-columns:1fr 1fr}.filters .wide{grid-column:1/-1}}
    @media (max-width:640px){.stats{grid-template-columns:1fr}.filters{grid-template-columns:1fr}.page{padding:16px}th:nth-child(6),td:nth-child(6){display:none}}
  </style>
</head>
<body>
  <div class="page">
    <div class="top">
      <div>
        <h1>OWNER DASHBOARD</h1>
        <div class="sub">데일리 테스트와 주간 픽셀 테스트 결과를 함께 보는 관리자 전용 화면이에요.</div>
      </div>
      <div class="row-actions">
        <a class="btn" href="/" target="_blank" rel="noopener">테스트 열기</a>
        <button class="btn primary" id="logoutBtn" type="button">로그아웃</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><div class="label">총 테스트 수</div><div class="value" id="statTotal">-</div></div>
      <div class="stat"><div class="label">오늘 테스트 수</div><div class="value" id="statToday">-</div></div>
      <div class="stat"><div class="label">인기 있는 데일리 team</div><div class="value compact" id="statTopDailyTeam">-</div></div>
      <div class="stat"><div class="label">주간 테스트 최다 타입</div><div class="value compact" id="statTopWeeklyType">-</div></div>
    </div>

    <div class="card filters">
      <div class="wide">
        <label for="searchInput">검색</label>
        <input id="searchInput" type="text" placeholder="별명, 결과명, 타입 키 검색" />
      </div>
      <div>
        <label for="langFilter">언어</label>
        <select id="langFilter">
          <option value="">전체</option>
          <option value="ko">ko</option>
          <option value="en">en</option>
          <option value="ja">ja</option>
          <option value="zh">zh</option>
        </select>
      </div>
      <div>
        <label for="limitFilter">표시 수</label>
        <select id="limitFilter">
          <option value="20">20</option>
          <option value="50" selected>50</option>
          <option value="100">100</option>
          <option value="200">200</option>
        </select>
      </div>
      <div>
        <button class="btn primary" id="refreshBtn" type="button">새로고침</button>
      </div>
    </div>

    <div class="card table-card">
      <table>
        <thead>
          <tr>
            <th style="width:160px;">시간</th>
            <th style="width:110px;">별명</th>
            <th style="width:230px;">결과</th>
            <th style="width:90px;">언어</th>
            <th style="width:180px;">점수</th>
            <th>답변 기록</th>
          </tr>
        </thead>
        <tbody id="resultBody"></tbody>
      </table>
      <div class="empty" id="emptyBox" style="display:none;">저장된 결과가 없어요.</div>
    </div>
  </div>

  <script>
    let allItems = [];

    async function ensureAdmin(){
      const res = await fetch('/api/admin/me');
      const data = await res.json();
      if(!data.authenticated){
        location.href='/admin-login';
      }
    }

    function formatDate(value){
      const d = new Date(value);
      return isNaN(d) ? (value || '-') : d.toLocaleString('ko-KR');
    }

    function scoreChips(pcts){
      if(!pcts || typeof pcts !== 'object') return '-';
      return ['soft','dewy','easy','daily'].map(key => {
        const label = key.charAt(0).toUpperCase() + key.slice(1);
        return `<span class="chip">${label} ${pcts[key] ?? '-'}%</span>`;
      }).join('');
    }

    function normalizeItem(item){
      return {
        ...item,
        sessionId: item.sessionId || item.session_id || '',
        resultKey: item.resultKey || item.result_key || '',
        resultTitle: item.resultTitle || item.result_title || '',
        oneLine: item.oneLine || item.one_line || '',
        createdAt: item.createdAt || item.created_at || '',
        receivedAt: item.receivedAt || item.received_at || '',
        pcts: item.pcts || {},
        answers: Array.isArray(item.answers) ? item.answers : [],
      };
    }

    function getKind(item){
      return String(item.resultKey || '').toLowerCase().startsWith('daily-') ? 'daily' : 'weekly';
    }

    function getResultLabel(item){
      const kind = getKind(item);
      if(kind === 'daily'){
        if(item.resultKey === 'daily-warm') return 'team 다굽자';
        if(item.resultKey === 'daily-cool') return 'team 다얼자';
      }
      return item.resultTitle || item.resultKey || '-';
    }

    function renderRows(){
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      const lang = document.getElementById('langFilter').value;
      const limit = Number(document.getElementById('limitFilter').value || 50);

      const filtered = allItems.map(normalizeItem).filter(item => {
        const hitText = [item.nickname, item.resultTitle, item.resultKey, item.oneLine].join(' ').toLowerCase();
        const searchOk = !q || hitText.includes(q);
        const langOk = !lang || item.lang === lang;
        return searchOk && langOk;
      }).slice(0, limit);

      const body = document.getElementById('resultBody');
      const empty = document.getElementById('emptyBox');
      if(!filtered.length){
        body.innerHTML='';
        empty.style.display='block';
        return;
      }
      empty.style.display='none';
      body.innerHTML = filtered.map(item => {
        const kind = getKind(item);
        const kindLabel = kind === 'daily' ? '데일리' : '주간';
        const kindClass = kind === 'daily' ? 'kind-daily' : 'kind-weekly';
        return `
          <tr>
            <td>${formatDate(item.createdAt || item.receivedAt)}</td>
            <td><strong>${item.nickname || '-'}</strong><div class="muted">${item.sessionId || ''}</div></td>
            <td>
              <div><span class="chip ${kindClass}">${kindLabel}</span></div>
              <div><strong>${getResultLabel(item)}</strong></div>
              <div class="muted">${item.resultKey || '-'}</div>
              <div class="muted">${item.oneLine || ''}</div>
            </td>
            <td>${item.lang || '-'}</td>
            <td>${scoreChips(item.pcts)}</td>
            <td><div class="muted">${Array.isArray(item.answers) && item.answers.length ? item.answers.join(', ') : '-'}</div></td>
          </tr>
        `;
      }).join('');
    }

    async function loadStats(){
      const res = await fetch('/api/admin/stats');
      const data = await res.json();
      document.getElementById('statTotal').textContent = data.total || 0;
      document.getElementById('statToday').textContent = data.today || 0;
      document.getElementById('statTopDailyTeam').textContent = data.topDailyTeam || '-';
      document.getElementById('statTopWeeklyType').textContent = data.topWeeklyType || '-';
    }

    async function loadResults(){
      const res = await fetch('/api/admin/results');
      allItems = await res.json();
      renderRows();
    }

    document.getElementById('refreshBtn').addEventListener('click', async ()=>{
      await loadStats();
      await loadResults();
    });
    document.getElementById('searchInput').addEventListener('input', renderRows);
    document.getElementById('langFilter').addEventListener('change', renderRows);
    document.getElementById('limitFilter').addEventListener('change', renderRows);
    document.getElementById('logoutBtn').addEventListener('click', async ()=>{
      await fetch('/api/admin/logout', { method:'POST' });
      location.href='/admin-login';
    });

    (async function init(){
      await ensureAdmin();
      await loadStats();
      await loadResults();
    })();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(()=>{});
    }
  </script>
</body>
</html>
